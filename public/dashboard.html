<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Rocha Barbearia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <!-- Sidebar / Painel Lateral -->
    <aside>
        <div>
            <div class="brand">
                <h2>ROCHA BARBEARIA</h2>
                <p>Painel de Gestão</p>
            </div>
        </div>

        <div class="user-profile">
            <span>Conectado como:</span>
            <strong id="userEmail">carregando...</strong>
            <button id="btnLogout" class="btn-logout">Sair da Conta</button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main>
        <header>
            <h1>Painel de Agendamentos</h1>
            <p>Selecione seu serviço e reserve seu horário com facilidade.</p>
        </header>

        <div class="grid-container">
            <!-- Formulário de Agendamento -->
            <div class="card">
                <h3>Novo Agendamento</h3>
                <form id="appointmentForm">
                    <div class="input-group">
                        <label for="serviceSelect">Serviço Desejado</label>
                        <select id="serviceSelect" required>
                            <option value="">Carregando serviços...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="appointmentDate">Data do Atendimento</label>
                        <input type="date" id="appointmentDate" required>
                    </div>

                    <div class="input-group">
                        <label for="timeSelect">Horário Disponível</label>
                        <select id="timeSelect" required>
                            <option value="">Selecione o serviço e a data primeiro...</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Confirmar Agendamento</button>
                </form>
                <div id="mensagemAgendamento" class="mensagem-feedback"></div>
            </div>

            <!-- Meus Agendamentos -->
            <div class="card">
                <h3>Meus Agendamentos</h3>
                <div class="table-responsive">
                    <div id="listaAgendamentos" style="color: #cccccc; font-size: 14px;">
                        Carregando agendamentos...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ===== Sessão (JWT) =====
        const token = localStorage.getItem('token');
        const userEmail = localStorage.getItem('userEmail');

        if (!token || !userEmail) {
            window.location.href = '/index.html';
        } else {
            document.getElementById('userEmail').textContent = userEmail;
        }

        // fetch que já envia o token e trata sessão expirada
        async function apiFetch(url, options = {}) {
            const resposta = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...(options.headers || {})
                }
            });

            if (resposta.status === 401) {
                localStorage.clear();
                window.location.href = '/index.html';
            }
            return resposta;
        }

        // Evita XSS ao montar HTML com dados vindos do banco
        function esc(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function formatarPreco(valor) {
            return Number(valor).toFixed(2).replace('.', ',');
        }

        // ===== Logout =====
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/index.html';
        });

        // ===== Bloquear datas passadas (usa a data LOCAL, não UTC) =====
        const agora = new Date();
        const hoje = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;
        document.getElementById('appointmentDate').min = hoje;

        let listaServicos = [];

        // ===== Carregar Serviços =====
        async function carregarServicos() {
            try {
                const resposta = await fetch('/api/services');
                listaServicos = await resposta.json();
                const select = document.getElementById('serviceSelect');

                select.innerHTML = '<option value="">Selecione um serviço...</option>';
                listaServicos.forEach(s => {
                    select.innerHTML += `<option value="${s.id}">${esc(s.nome)} - R$ ${formatarPreco(s.preco)} (${s.duracao_minutos} min)</option>`;
                });
            } catch (err) {
                console.error(err);
            }
        }

        // ===== Gerar Horários Dinâmicos =====
        function gerarHorarios() {
            const serviceId = document.getElementById('serviceSelect').value;
            const timeSelect = document.getElementById('timeSelect');

            timeSelect.innerHTML = '<option value="">Selecione um horário...</option>';

            if (!serviceId) return;

            const servicoEscolhido = listaServicos.find(s => s.id == serviceId);
            const duracao = servicoEscolhido ? servicoEscolhido.duracao_minutos : 30;
            const intervaloMinutos = duracao > 30 ? 60 : 30;

            const horaInicio = 9 * 60;
            const horaFim = 19 * 60;

            // CORREÇÃO: o atendimento precisa TERMINAR até as 19:00
            for (let minutos = horaInicio; minutos + duracao <= horaFim; minutos += intervaloMinutos) {
                const h = Math.floor(minutos / 60);
                const m = minutos % 60;
                const horaFormatada = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');

                timeSelect.innerHTML += `<option value="${horaFormatada}">${horaFormatada}</option>`;
            }
        }

        document.getElementById('serviceSelect').addEventListener('change', gerarHorarios);
        document.getElementById('appointmentDate').addEventListener('change', gerarHorarios);

        // ===== Carregar Agendamentos em Formato de Tabela =====
        async function carregarAgendamentos() {
            try {
                const resposta = await apiFetch('/api/appointments');
                const agendamentos = await resposta.json();
                const container = document.getElementById('listaAgendamentos');

                if (agendamentos.length === 0) {
                    container.innerHTML = '<p style="color: #cccccc; padding: 10px 0;">Nenhum agendamento encontrado.</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Serviço</th>
                                <th>Data e Hora</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                agendamentos.forEach(a => {
                    const dataFormatada = new Date(a.data_hora).toLocaleString('pt-BR', {
                        dateStyle: 'short',
                        timeStyle: 'short'
                    });
                    html += `
                        <tr>
                            <td><strong>${esc(a.servico)}</strong><br><small style="color: #cccccc">R$ ${formatarPreco(a.preco)}</small></td>
                            <td>${dataFormatada}</td>
                            <td><span class="badge">${esc(a.status)}</span></td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('listaAgendamentos').innerHTML = '<p style="color: #e74c3c;">Erro ao carregar agendamentos.</p>';
            }
        }

        // ===== Enviar Novo Agendamento =====
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const serviceId = document.getElementById('serviceSelect').value;
            const data = document.getElementById('appointmentDate').value;
            const hora = document.getElementById('timeSelect').value;
            const msgDiv = document.getElementById('mensagemAgendamento');

            const dataHora = `${data}T${hora}:00`;

            try {
                const resposta = await apiFetch('/api/appointments', {
                    method: 'POST',
                    body: JSON.stringify({ serviceId, dataHora })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    msgDiv.textContent = dados.message;
                    msgDiv.className = "mensagem-feedback sucesso";
                    document.getElementById('appointmentForm').reset();
                    document.getElementById('timeSelect').innerHTML = '<option value="">Selecione o serviço e a data primeiro...</option>';
                    carregarAgendamentos();
                } else {
                    msgDiv.textContent = dados.error || "Erro ao agendar.";
                    msgDiv.className = "mensagem-feedback erro";
                }
            } catch (err) {
                console.error(err);
                msgDiv.textContent = "Erro de conexão com o servidor.";
                msgDiv.className = "mensagem-feedback erro";
            }
        });

        carregarServicos();
        carregarAgendamentos();
    </script>
</body>
</html>
