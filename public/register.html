<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Rocha Barbearia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- Logo no topo superior centralizada -->
    <div class="logo-container">
        <img src="logo.jpg" alt="Rocha Barbearia Logo">
    </div>

    <div class="auth-container">
        <h2>CRIAR CONTA</h2>
        <p class="subtitle">Cadastre-se para marcar seus horários</p>

        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>

        <div id="mensagemCadastro" class="mensagem-feedback"></div>

        <div class="auth-links">
            Já possui uma conta? <a href="index.html">Faça login</a>
        </div>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msgDiv = document.getElementById('mensagemCadastro');

            try {
                const resposta = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    msgDiv.textContent = dados.message || "Cadastro realizado com sucesso!";
                    msgDiv.className = "mensagem-feedback sucesso";

                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1200);
                } else {
                    msgDiv.textContent = dados.error || "Erro ao realizar cadastro.";
                    msgDiv.className = "mensagem-feedback erro";
                }
            } catch (err) {
                console.error(err);
                msgDiv.textContent = "Erro de conexão com o servidor.";
                msgDiv.className = "mensagem-feedback erro";
            }
        });
    </script>
</body>
</html>
